{% extends "base.html" %}

{% block title %}Login — PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(99, 102, 241, 0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: #818cf8;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </div>
      <h2 style="font-size: 1.8rem; margin-bottom: 0.35rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your saved budgets and recommendations</p>
    </div>

    {% if error %}
      <div class="alert alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>{{ error }}</div>
      </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next or '/dashboard' }}">

      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="req">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="name@example.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password <span class="req">*</span></label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
        Sign In to PocketSmart AI
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="font-weight: 600;">Create one free</a>
    </div>
  </div>
</div>
{% endblock %}
